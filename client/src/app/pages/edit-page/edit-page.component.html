
<h1>{{ this.mapService.map.name }}</h1>
<button (click)="openMapSettingsModal()">Edit Title</button>

@if (showModal) {
  <app-map-settings-modal 
    (closeModal)="closeMapSettingsModal()">
  </app-map-settings-modal>
}


<div class="app-layout" (mousedown)="onMouseDown($event)" (mouseup)="onMouseUp()">
    <app-brush-grid class="brush-grid"></app-brush-grid>
    <app-tile-grid class="tile-grid" ></app-tile-grid>
</div>

<p class="description"> {{this.mapService.map.description}} </p>
