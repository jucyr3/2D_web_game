<div class="preview-container" (mouseenter)="showDescription(map)" (mouseleave)="hideDescription()">
    @if (map.previewImage) {
        <img [src]="'data:image/jpeg;base64,' + map.previewImage" [alt]="map.name" class="preview-image" />
    }
    @if (selectedMap === map) {
        <div class="description-overlay">
            {{ map.description }}
        </div>
    }
</div>
