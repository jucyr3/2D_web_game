<div class="item-container">
    <img
      class="item"
      [ngClass]="{ grayscale: this.itemService.itemAmounts[this.itemObject.name] === 0 }"
      [src]="'../assets/' + itemId + '.png'"
      [alt]="itemId"
      draggable="false"
      
      (mousedown)="onMouseDown($event)"
      (mouseup)="onMouseUp($event)"
      onmousedown="return false;"
      onselectstart="return false;"
    />
  </div>
  <div *ngIf="draggingState.isDragging" class="drag-preview" [style.left.px]="draggingState.dragX" [style.top.px]="draggingState.dragY">
    <img [src]="'../assets/' + itemId + '.png'" [alt]="itemId" />
</div>
