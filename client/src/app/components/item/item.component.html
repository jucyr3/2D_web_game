<div class="item-container">
    <img
        class="item"
        [ngClass]="{ grayscale: isDragging }"
        [src]="'../assets/' + itemType + '.png'"
        [alt]="itemType"
        draggable="false"
        (mousedown)="onMouseDown($event)"
        onmousedown="return false;"
        onselectstart="return false;"
    />
</div>
<div *ngIf="isDragging" class="drag-preview" [style.left.px]="dragX" [style.top.px]="dragY">
    <img [src]="'../assets/' + itemType + '.png'" [alt]="itemType" />
</div>
