<div class="modal">
    <div class="modal-content">
        <h2>Edit Map Settings</h2>
        <input type="text" #titleInput [value]="mapTitle" />
        <br />
        <input type="text" #descriptionInput [value]="description" />
        <br />
        <button (click)="saveSettings({ title: titleInput.value, description: descriptionInput.value })">Save</button>
        <button (click)="close()">Cancel</button>
    </div>
</div>
