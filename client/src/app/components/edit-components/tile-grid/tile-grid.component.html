<div
    class="tile-grid"
    [style.grid-template-columns]="'repeat(' + this.mapService.map.size + ', 1fr)'"
    [style.grid-template-rows]="'repeat(' + this.mapService.map.size + ', 1fr)'"
    (mouseleave)="onMouseLeave()"
    (mouseenter)="onMouseEnter($event)"   
>

    
    <app-tile
        *ngFor="let tile of this.mapService.map.flattenedTileMatrix; let i = index"
        [tileNumber]="i"
        [tileObject]="tile"
        #tileRef
    ></app-tile>
</div>
