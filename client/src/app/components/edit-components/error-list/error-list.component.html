@if (this.mapService.errorList.length > 0) {
<div class="error-box">
    <h4 class="title">Error list:</h4>
    <ul class="error-list">
        @for (error of this.mapService.errorList; track error) {
        <li>{{ this.errorDescriptions[error] }}</li>
        } @empty {
        <li>There are no items.</li>
        }
    </ul>
</div>
}
