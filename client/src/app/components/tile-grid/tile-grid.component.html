<div
    class="tile-grid"
    [style.grid-template-columns]="'repeat(' + mapSize + ', 1fr)'"
    [style.grid-template-rows]="'repeat(' + mapSize + ', 1fr)'"
    (mouseleave)="onMouseLeave()"
    (mouseenter)="onMouseEnter($event)"
>
    <app-tile
        *ngFor="let tile of [].constructor(mapSize*mapSize); let i = index"
        [tileNumber]="i"
    ></app-tile>
</div>
